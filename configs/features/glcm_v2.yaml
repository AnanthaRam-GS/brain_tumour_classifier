feature_set_name: glcm_v2
feature_version: v2
algorithm: gray_level_cooccurrence_matrix
feature_prefix: glcm
input_representation: native_roi_image_and_mask
roi_policy: phase1_roi_contract_v1
expected_feature_count: 84
description: Expanded mask-aware GLCM representation retaining directional and scale-specific texture values plus v1 aggregates.
parameters:
  gray_levels: 32
  distances:
    - 1
    - 2
    - 4
  angles_degrees:
    - 0
    - 45
    - 90
    - 135
  symmetric: true
  normed: true
  properties:
    - contrast
    - dissimilarity
    - homogeneity
    - energy
    - correlation
    - ASM
  aggregation:
    - mean
    - std
  directional_features: true
  quantization:
    source_range:
      - 0.0
      - 1.0
    method: uniform
    levels: 32
  mask_policy:
    - only pixel pairs where BOTH pixels lie inside tumor_mask
    - do not include zero-filled contextual background as valid GLCM pairs
expected_output:
  directional_feature_count_rule: 6 properties x 3 distances x 4 angles
  aggregate_feature_count_rule: 6 properties x 2 aggregation statistics
  total_feature_count_rule: 72 directional features + 12 aggregate features
notes:
  - This v2 improvement experiment preserves directional and scale-specific GLCM values while retaining v1-compatible aggregate features.
  - It must not overwrite or replace configs/features/glcm.yaml or data/features/glcm/glcm_features.csv.

