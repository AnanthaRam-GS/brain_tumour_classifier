model_name: xgboost
model_version: v1
random_seed: 42
feature_set: glcm
objective: multi:softprob
num_class: 3
eval_metric: mlogloss
preprocessing:
  imputation: median
  scaling: null
fixed_parameters:
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  gamma: 0
  reg_alpha: 0
  reg_lambda: 1
  tree_method: hist
  verbosity: 0
  n_jobs: -1
candidate_grid:
  n_estimators:
    - 100
    - 200
  max_depth:
    - 3
    - 5
  learning_rate:
    - 0.05
    - 0.10
selection_policy:
  primary_metric: macro_f1
  tie_breakers:
    - balanced_accuracy
    - accuracy
    - lower_log_loss
    - lower_max_depth
    - fewer_estimators
    - lower_learning_rate
final_retraining_policy: train_plus_validation
feature_implementation_commit: ad1415b3
feature_version: v1
split_version: phase1_patient_split_v1
split_seed: 42
importance_type: estimator.feature_importances_
