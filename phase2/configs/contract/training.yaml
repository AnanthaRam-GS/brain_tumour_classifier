contract_version: "1.0.0"

batch_size: 32
eval_batch_size: 64
max_epochs: 40
num_workers: 0
precision: fp32

optimizer:
  name: adamw
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8

lr_grid: [1.0e-4, 3.0e-4, 1.0e-3]
grid_seed: 42
final_seeds: [42, 43, 44]

scheduler:
  name: cosine
  t_max: max_epochs
  eta_min: 0.0
  step: per_epoch

loss:
  name: cross_entropy
  class_weights: train_inverse_frequency

early_stopping:
  monitor: val_macro_f1
  mode: max
  patience: 8
  min_delta: 0.0
  tie_break: lower_val_loss

selection: best_val_macro_f1
